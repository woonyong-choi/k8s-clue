{{- include "clue.validateAccess" . -}}
{{- $accessMode := include "clue.accessMode" . | trim -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clue.fullname" . }}
  labels:
    {{- include "clue.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- if and (eq $accessMode "loadbalancer") .Values.access.loadBalancer.annotations }}
  annotations:
    {{- toYaml .Values.access.loadBalancer.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ include "clue.serviceType" . | trim }}
  selector:
    {{- include "clue.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: console
      {{- if eq $accessMode "nodeport" }}
      nodePort: {{ .Values.access.nodePort }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clue.fullname" . }}-metrics
  labels:
    {{- include "clue.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  type: ClusterIP
  selector:
    {{- include "clue.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  ports:
    - name: metrics
      port: 9090
      targetPort: http
