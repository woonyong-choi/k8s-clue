{{- $name := printf "%s-bootstrap" (include "clue.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $postgresPassword := .Values.postgresql.auth.password | default (randAlphaNum 32) -}}
{{- $agentToken := .Values.agent.token | default (randAlphaNum 48) -}}
{{- $adminPassword := .Values.initialAdmin.password | default (randAlphaNum 24) -}}
{{- $filterCursorSigningKey := randAlphaNum 64 -}}
{{- if $existing -}}
{{- $postgresPassword = ((index $existing.data "POSTGRES_PASSWORD") | b64dec) | default $postgresPassword -}}
{{- $agentToken = ((index $existing.data "AGENT_TOKEN") | b64dec) | default $agentToken -}}
{{- $adminPassword = ((index $existing.data "AUTH_PASSWORD") | b64dec) | default $adminPassword -}}
{{- $filterCursorSigningKey = ((index $existing.data "FILTER_CURSOR_SIGNING_KEY") | b64dec) | default $filterCursorSigningKey -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "clue.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username $postgresPassword (include "clue.fullname" .) .Values.postgresql.auth.database | quote }}
  AGENT_TOKEN: {{ $agentToken | quote }}
  AUTH_EMAIL: {{ .Values.initialAdmin.email | quote }}
  AUTH_PASSWORD: {{ $adminPassword | quote }}
  FILTER_CURSOR_SIGNING_KEY: {{ $filterCursorSigningKey | quote }}
  LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
