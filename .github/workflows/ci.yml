name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: make gate-backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run check

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint workflow files
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: clue-demo
      - name: Run OSS demo (kind ImagePullBackOff -> Draft PR contract -> verification)
        env:
          # 토큰이 없으므로 실제 Draft PR은 만들지 않는다. Draft PR 단계는
          # 계약 테스트(모킹된 GitOps 경로)로만 검증한다.
          DEMO_SKIP_PR: "1"
          DEMO_KIND_CONTEXT: kind-clue-demo
        run: make demo
